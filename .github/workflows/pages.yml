name: Deploy site to GitHub Pages

# Pages must be enabled once by hand (Settings > Pages > Source: GitHub
# Actions). The Actions token is refused when it tries to create the Pages
# site itself ("Resource not accessible by integration"), so configure-pages
# only reads the existing configuration here.
on:
  push:
    branches: [claude/fantasy-draft-rankings-r5665l]
    paths:
      - viewer/board.html
      - scripts/build_site.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild site from viewer source
        run: python3 scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
